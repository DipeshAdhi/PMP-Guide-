<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My account - PM Ready</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Project_Mangment_Tool/css/app.css">
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <header class="top">
        <div class="in">
            <a class="brand" href="../index.html">PM Ready</a>
            <a class="back" style="margin-left: 0;" href="../Project_Mangment_Tool/index.html">Projects</a>
            <a class="back" style="margin-left: 0;" href="../learn/index.html">Course</a>
            <span id="chip" class="user-chip"></span>
        </div>
    </header>

    <main class="page" id="main">
        <p class="muted">Loading…</p>
    </main>

<script src="../assets/js/account.js"></script>
<script src="../Project_Mangment_Tool/js/ui.js"></script>
<script>
const A = window.PMAccount;
const { esc, toast } = PMT.ui;
const ROLE = { owner: 'Owner', admin: 'Admin', member: 'Member', manager: 'Manager', viewer: 'Viewer' };
let me, meData, companies = [];

function chip(user) {
    document.getElementById('chip').innerHTML = `<details><summary>${A.avatarHtml(user, 28)}<span>${esc(user.name)}</span></summary>
        <div class="menu"><div class="who">${esc(user.email)}</div>
        ${user.platformRole === 'admin' ? '<a href="../admin/index.html">Admin dashboard</a>' : ''}
        <button type="button" id="signOut">Sign out</button></div></details>`;
    document.getElementById('signOut').addEventListener('click', () => A.signOut());
}

async function load() {
    if (!await A.available()) {
        document.getElementById('main').innerHTML = `<div class="card empty"><h2>Accounts need the PM Ready server</h2><p>Open the site through the server (see backend/README.md). Without it, your course progress and projects are saved in this browser.</p></div>`;
        return;
    }
    const m = await A.me(true);
    if (!m) { location.replace(A.signInUrl()); return; }
    me = m.user;
    meData = m;
    chip(me);
    const [cs, ps, course] = await Promise.all([A.api('GET', '/companies'), A.api('GET', '/projects'), A.api('GET', '/me/course')]);
    companies = cs.companies;
    render(ps.projects, course);
}

function render(projects, course) {
    const done = course.modulesDone || 0;
    document.getElementById('main').innerHTML = `
        <div class="page-head"><div><h1>Hello, ${esc(me.name.split(' ')[0])}</h1>
            <p class="muted">${me.accountType === 'company' ? 'Company account' : 'Personal account'} · ${esc(me.email)} · joined ${new Date(me.createdAt).toLocaleDateString(undefined, { dateStyle: 'medium' })}</p></div></div>
        ${A.verifyBanner(meData)}
        <div class="acct-grid">
            <section class="card">
                <h2>📘 Course</h2>
                <div class="bar" aria-label="${done} of 8 modules"><div style="width:${done / 8 * 100}%"></div></div>
                <p class="small" style="margin: 0.5rem 0 0.8rem;">${done} of 8 modules complete. Progress is saved to your account, so it follows you to any device.</p>
                <a class="btn btn-ghost btn-sm" href="../learn/index.html">${done ? 'Continue the course' : 'Start the course'} →</a>
            </section>
            <section class="card">
                <h2>📁 Projects</h2>
                ${projects.length ? `<table class="tbl"><tbody>${projects.slice(0, 6).map(p => `<tr><td><a href="../Project_Mangment_Tool/project.html?id=${encodeURIComponent(p.id)}">${esc(p.name)}</a>${p.companyName ? `<br><span class="muted small">${esc(p.companyName)}</span>` : ''}</td><td><span class="pill">${ROLE[p.role]}</span></td></tr>`).join('')}</tbody></table>`
                    : '<p class="muted small">No projects yet.</p>'}
                <p style="margin-top: 0.7rem;"><a class="btn btn-ghost btn-sm" href="../Project_Mangment_Tool/index.html">All projects →</a></p>
            </section>

            <section class="card span">
                <h2>🏢 Companies</h2>
                ${companies.length ? `<div class="kpis" style="margin-bottom: 0.8rem;">${companies.map(c => `<a class="card kpi" style="text-decoration: none;" href="company.html?id=${encodeURIComponent(c.id)}">
                    <div class="n" style="font-size: 1.15rem;">${esc(c.name)}</div><div class="l">${ROLE[c.role]} · ${c.members} staff · ${c.projects} project${c.projects === 1 ? '' : 's'}</div>
                    <div class="l" style="margin-top: 0.4rem; color: var(--ink); font-weight: 600;">${c.role === 'member' ? 'Open →' : 'Manage staff →'}</div></a>`).join('')}</div>`
                    : '<p class="muted small" style="margin-bottom: 0.8rem;">You are not in a company yet. Create one to add your staff and run company projects, or ask your company admin to add your email.</p>'}
                <form class="inline-form" id="newCompany" style="border-top: 1px solid var(--line); padding-top: 1rem;">
                    <div class="field"><label for="ncName">New company</label><input class="input" id="ncName" name="name" maxlength="120" required placeholder="Company name"></div>
                    <button class="btn btn-ghost" type="submit">＋ Create company</button>
                </form>
            </section>

            <section class="card">
                <h2>👤 Profile</h2>
                <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
                    ${A.avatarHtml(me, 72)}
                    <div class="toolbar" style="flex-wrap: wrap;">
                        <label class="btn btn-ghost btn-sm" for="avatarFile">📷 ${me.avatarUrl ? 'Change picture' : 'Add a picture'}</label>
                        <input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp" hidden>
                        ${me.avatarUrl ? '<button class="btn btn-ghost btn-sm" type="button" id="avatarRemove">Remove</button>' : ''}
                        <span class="hint" style="flex-basis: 100%;">JPEG, PNG or WebP. It's cropped to a square and shown to people you work with.</span>
                    </div>
                </div>
                <form class="inline-form" id="profile"><div class="field"><label for="pfName">Name</label><input class="input" id="pfName" name="name" maxlength="80" value="${esc(me.name)}" required></div><button class="btn btn-ghost" type="submit">Save</button></form>
            </section>
            <section class="card">
                <h2>🔒 ${me.hasPassword ? 'Password' : 'Set a password'}</h2>
                ${me.google ? '<p class="muted small" style="margin-bottom: 0.6rem;">You can sign in with Google' + (me.hasPassword ? ' or with your email and password.' : '. Set a password to also sign in with your email.') + '</p>' : ''}
                <form id="password">
                    ${me.hasPassword ? '<div class="field"><label for="pwCur">Current password</label><input class="input" type="password" id="pwCur" name="current" autocomplete="current-password" required></div>' : ''}
                    <div class="field" style="margin-top: 0.6rem;"><label for="pwNew">New password</label><input class="input" type="password" id="pwNew" name="next" minlength="8" autocomplete="new-password" required><span class="hint">At least 8 characters. Other devices will be signed out.</span></div>
                    <button class="btn btn-ghost" type="submit" style="margin-top: 0.6rem;">${me.hasPassword ? 'Change password' : 'Set password'}</button>
                </form>
            </section>
        </div>`;
}

// ─── Actions ───
const run = async (fn, okMsg) => {
    try { await fn(); if (okMsg) toast(okMsg, 'good'); await load(); }
    catch (e) { toast(e.userMessage || 'Something went wrong.', 'bad'); }
};
// ─── Profile picture: crop to a 256 px square in the browser, then upload ───
async function squareJpeg(file) {
    const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = () => reject(new Error('That file is not a picture we can read.'));
        i.src = URL.createObjectURL(file);
    });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const cv = document.createElement('canvas');
    cv.width = cv.height = 256;
    const g = cv.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, 256, 256);
    g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
    URL.revokeObjectURL(img.src);
    return cv.toDataURL('image/jpeg', 0.85);
}
document.addEventListener('change', async e => {
    if (e.target.id !== 'avatarFile' || !e.target.files[0]) return;
    const file = e.target.files[0];
    if (file.size > 15 * 1024 * 1024) { toast('Choose a picture smaller than 15 MB.', 'warn'); return; }
    try { const image = await squareJpeg(file); await run(() => A.api('PUT', '/auth/me/avatar', { image }), 'Picture saved'); }
    catch (err) { toast(err.message, 'bad'); }
});
document.addEventListener('click', e => {
    if (e.target.id === 'avatarRemove') run(() => A.api('DELETE', '/auth/me/avatar'), 'Picture removed');
});
document.addEventListener('submit', e => {
    const f = e.target, v = Object.fromEntries(new FormData(f));
    e.preventDefault();
    if (f.id === 'newCompany') A.api('POST', '/companies', v).then(r => { location.href = `company.html?id=${encodeURIComponent(r.company.id)}`; }, err => toast(err.userMessage || 'Could not create the company.', 'bad'));
    if (f.id === 'profile') run(() => A.api('PATCH', '/auth/me', v).then(() => A.me(true)), 'Saved');
    if (f.id === 'password') run(() => A.api('POST', '/auth/password', v), 'Password changed');
});
document.addEventListener('click', e => { const d = document.querySelector('#chip details'); if (d && d.open && !d.contains(e.target)) d.open = false; });

load();
</script>
</body>
</html>
